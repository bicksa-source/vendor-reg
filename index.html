<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموذج تسجيل البائع</title>
</head>
<body>
    <h1>نموذج تسجيل البائع</h1>
    <form action="https://script.google.com/macros/s/AKfycbyZMq5aw3qVUp2UgfoUlWWw4Gpq7ts9bxUYLkPWXYJpcyfqOuXcZd4w4l32Q5_1aO5SkA/exec" method="POST">
        <label for="name">اسم البائع:</label><br>
        <input type="text" id="name" name="name" required><br>
        <label for="email">البريد الإلكتروني:</label><br>
        <input type="email" id="email" name="email" required><br>
        <label for="phone">رقم الهاتف:</label><br>
        <input type="tel" id="phone" name="phone" required><br>
        <input type="submit" value="تسجيل"> 
    </form>
</body>
</html>
